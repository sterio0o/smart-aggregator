<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои отчеты</title>
    <style>
        .active-page { font-weight: bold; font-size: 1.2em; color: black; }
        .page-link { margin: 0 5px; text-decoration: none; color: blue; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-profile { background: #17a2b8; }
        .btn-profile:hover { background: #138496; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 10px; text-align: left; border: 1px solid #ddd; }
        .table th { background: #f2f2f2; }
        .pagination { margin-top: 20px; }
        .empty { text-align: center; padding: 40px; color: #666; }
        .report-date { white-space: nowrap; }
        .report-summary {
            max-width: 300px;
            word-break: break-word;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .keywords {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        .source-link {
            display: block;
            padding: 2px 0;
            font-size: 0.8em;
            word-break: break-all;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .source-link a {
            color: #1565c0;
            text-decoration: none;
        }
        .source-link a:hover {
            text-decoration: underline;
        }
        .doc-count {
            font-weight: bold;
            color: #1976d2;
            font-size: 1.1em;
        }
        .id-short {
            font-family: monospace;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Мои отчеты</h2>
        <div>
            <a th:href="@{/web/profiles/my-profile}" class="btn btn-profile">Мой профиль</a>
            <a th:href="@{/web/profiles/my-sources}" class="btn btn-secondary">Мои подписки</a>
            <a th:href="@{/web/profiles/sources}" class="btn">Все источники</a>
        </div>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th style="width: 10%;">ID</th>
            <th style="width: 30%;">Сводка от нейросети</th>
            <th style="width: 15%;">Ключевые слова</th>
            <th style="width: 25%;">Ссылки на документы</th>
            <th style="width: 10%;">Кол-во</th>
            <th style="width: 10%;">Дата</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${reportsPage.content}">
            <td class="id-short">
                <span th:text="${#strings.substring(report.id, 0, 8)}"></span>...
            </td>
            <td class="report-summary">
                <div th:text="${report.aiSummary}">Сводка отчета</div>
            </td>
            <td>
                <span th:each="keyword : ${report.keywords}" class="keywords" th:text="${keyword}"></span>
                <span th:if="${report.keywords == null or report.keywords.empty}" style="color: #999;">-</span>
            </td>
            <td>
                <div th:if="${report.sourceContentIds != null and !report.sourceContentIds.empty}">
                    <span th:each="url : ${report.sourceContentIds}" class="source-link">
                        <a th:href="${url}" target="_blank" th:text="${#strings.length(url) > 50 ? #strings.substring(url, 0, 50) + '...' : url}"></a>
                    </span>
                </div>
                <span th:unless="${report.sourceContentIds != null and !report.sourceContentIds.empty}" style="color: #999;">-</span>
            </td>
            <td>
                <span class="doc-count" th:text="${report.sourceContentIds != null ? report.sourceContentIds.size() : 0}">0</span>
            </td>
            <td class="report-date" th:text="${#temporals.format(report.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2024 12:00</td>
        </tr>
        <tr th:if="${reportsPage.empty}">
            <td colspan="6" class="empty">У вас нет созданных отчетов</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${reportsPage.totalPages > 1}" class="pagination">
        <span>Страницы: </span>
        <span th:each="i : ${#numbers.sequence(0, reportsPage.totalPages - 1)}">
            <a th:href="@{/web/profiles/my-reports(page=${i}, size=${reportsPage.size})}"
               th:text="${i + 1}"
               th:class="${reportsPage.number == i} ? 'page-link active-page' : 'page-link'">
            </a>
        </span>
    </div>
</div>
</body>
</html>
